services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - ama

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ama

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ama}
      POSTGRES_USER: ${DB_USERNAME:-ama}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - ama-postgres-data:/var/lib/postgresql/data
    networks:
      - ama

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ama

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-ama_minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-ama_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ama-minio-data:/data
    networks:
      - ama

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-ama_minio} ${AWS_SECRET_ACCESS_KEY:-ama_minio_secret}; do sleep 1; done;
      mc mb -p local/${AWS_BUCKET:-ama-evidence};
      exit 0;
      "
    networks:
      - ama

networks:
  ama:
    driver: bridge

volumes:
  ama-postgres-data:
  ama-minio-data:
