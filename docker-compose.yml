services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    networks:
      - ama

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ama

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ama}
      POSTGRES_USER: ${DB_USERNAME:-ama}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - ama-postgres-data:/var/lib/postgresql/data
    networks:
      - ama

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ama

networks:
  ama:
    driver: bridge

volumes:
  ama-postgres-data:
