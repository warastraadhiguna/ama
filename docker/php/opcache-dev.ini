; Dev-only tuning. The app source is bind-mounted from the Windows host,
; and PHP-FPM's OPcache stats every included file on every request to
; check its mtime — over the WSL2/Docker Desktop bind-mount boundary that
; turns thousands of small vendor/ file stats into multi-second page loads
; (~12s/request observed), even though raw DB/Redis connections are fast.
;
; validate_timestamps stays on (had it disabled once — bootstrap/
; providers.php picked up a code edit only after a container restart,
; which is a worse trade than the slow requests it "fixed"). Instead,
; revalidate_freq widens the window between re-stat sweeps: within it,
; requests reuse the cached compile and are fast; a PHP file edited more
; than ~15s ago is picked up on the very next request, same as stock PHP —
; just less eagerly. No manual cache-clear/restart needed after editing code.
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=15
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
