server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Docker's embedded DNS + a variable target (rather than a bare
    # `fastcgi_pass app:9000`) makes nginx re-resolve "app" per request
    # instead of caching its IP for the worker's lifetime — otherwise every
    # `docker compose up -d --build` that recreates the app container (new
    # IP) leaves nginx 502'ing until it's manually restarted.
    resolver 127.0.0.11 valid=10s;
    set $app_upstream app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $app_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
